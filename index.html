  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  body { margin: 0; padding: 12px; background: var(--bg); color: var(--text); }
  .app-container {
    max-width: 800px; margin: 0 auto; background: var(--card);

  }
  .controls-bar {
    display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center;

  }
  .select-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  select {
    padding: 7px 12px; border-radius: 8px; border: 1px solid #cbd5e1;
    font-weight: 600; color: var(--primary); background: var(--primary-light); cursor: pointer;
  }
  .progress-bar { height: 6px; background: #e2e8f0; border-radius: 999px; overflow: hidden; margin-bottom: 14px; }
  .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.3s ease; }
  .meta-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #64748b; margin-bottom: 10px; font-weight: 600; }
  
  /* Kvíz stílus */
  .question-text { font-size: 1.05rem; font-weight: 600; line-height: 1.5; margin-bottom: 16px; color: #0f172a; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-btn {
    text-align: left; padding: 12px 14px; border-radius: 8px;
    border: 2px solid #e2e8f0; background: #fff; font-size: 0.95rem;
    color: var(--text); cursor: pointer; transition: all 0.2s; line-height: 1.4;
  }
  body[dir="rtl"] .option-btn { text-align: right; }
  .option-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
  .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: #065f46; font-weight: 600; }
  .option-btn.wrong { border-color: var(--danger); background: var(--danger-bg); color: #991b1b; }
  .feedback { margin-top: 14px; padding: 12px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; display: none; }
  .feedback.show { display: block; background: #f1f5f9; border-left: 4px solid var(--primary); }
  body[dir="rtl"] .feedback.show { border-left: none; border-right: 4px solid var(--primary); }

  /* Tanulókártya stílus */
  .flashcard-wrapper { perspective: 1000px; min-height: 220px; cursor: pointer; margin: 16px 0; }
  .flashcard-inner {
    position: relative; width: 100%; min-height: 220px; transition: transform 0.6s;

  .flashcard-front, .flashcard-back {

/* ========================================================
   MOTOR ÉS VEZÉRLÉS
======================================================== */
let curMode = 'quiz';
let curLesson = '1';
let curLang = 'hu';
let curIdx = 0;
let quizScore = 0;

function getCurrentLessonData() {
  const modeData = lessonDB[curLesson]?.[curMode];
  const localizedData = modeData?.[curLang];
  if (Array.isArray(localizedData)) return localizedData;
  if (Array.isArray(localizedData?.questions)) return localizedData.questions;

  const englishData = modeData?.en;
  if (Array.isArray(englishData)) return englishData;
  if (Array.isArray(englishData?.questions)) return englishData.questions;
  return [];
}

function updateView() {
  const dir = (curLang === 'he' || curLang === 'ar' || curLang === 'fa') ? 'rtl' : 'ltr';
  document.body.dir = dir;

  const lData = getCurrentLessonData();
  const total = lData.length;

  document.getElementById('counter-txt').innerText = `${curIdx + 1} / ${total}`;
  document.getElementById('progress-fill').style.width = `${((curIdx + 1) / total) * 100}%`;

  if (curMode === 'quiz') {
    document.getElementById('quiz-view').style.display = 'block';
    document.getElementById('flashcard-view').style.display = 'none';
    document.getElementById('score-txt').innerText = `Pontszám: ${quizScore}`;
    renderQuizQuestion(lData[curIdx], total);
  } else {
    document.getElementById('quiz-view').style.display = 'none';
    document.getElementById('flashcard-view').style.display = 'block';
    document.getElementById('score-txt').innerText = `Kártya`;
    renderFlashcard(lData[curIdx], total);
  }
}

function renderQuizQuestion(qObj, total) {
  if (!qObj) return;
  document.getElementById('q-text').innerText = qObj.q;
  const box = document.getElementById('options-box');
  box.innerHTML = '';
  qObj.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerText = opt;
    btn.onclick = () => selectQuizAnswer(idx, qObj, btn);
    box.appendChild(btn);
  });
  const fb = document.getElementById('fb-box');
  fb.className = 'feedback';
  fb.innerText = '';
  const nxt = document.getElementById('quiz-next-btn');
  nxt.disabled = true;
  nxt.innerText = (curIdx === total - 1) ? 'Befejezés / Újrakezdés' : 'Következő ➔';
}

function selectQuizAnswer(idx, qObj, btn) {
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);
  if (idx === qObj.correct) {
    btn.classList.add('correct');
    quizScore++;
    document.getElementById('score-txt').innerText = `Pontszám: ${quizScore}`;
  } else {
    btn.classList.add('wrong');
    buttons[qObj.correct]?.classList.add('correct');
  }
  const fb = document.getElementById('fb-box');
 fb.innerText = qObj.r || qObj.rationale || "";
 fb.classList.add('show');
 document.getElementById('quiz-next-btn').disabled = false;
}

function nextQuizQuestion() {
 const lData = getCurrentLessonData();
  if (curIdx < lData.length - 1) {
    curIdx++;
  } else {
    curIdx = 0;
    quizScore = 0;
  }
  updateView();
}

function renderFlashcard(cObj, total) {
  if (!cObj) return;
  document.getElementById('card-inner').classList.remove('flipped');
  document.getElementById('card-front-text').innerText = cObj.f;
  document.getElementById('card-back-text').innerText = cObj.b;
  document.getElementById('card-prev-btn').disabled = (curIdx === 0);
  document.getElementById('card-next-btn').disabled = (curIdx === total - 1);
}

function flipCard() {
  document.getElementById('card-inner').classList.toggle('flipped');
}

function prevCard() {
  if (curIdx > 0) { curIdx--; updateView(); }
}

function nextCard() {
  const lData = getCurrentLessonData();
  if (curIdx < lData.length - 1) { curIdx++; updateView(); }
}

function switchMode(m) { curMode = m; curIdx = 0; quizScore = 0; updateView(); }
function switchLesson(l) { curLesson = l; curIdx = 0; quizScore = 0; updateView(); }
function switchLanguage(lang) { curLang = lang; updateView(); }

// Kezdő inicializálás
updateView();
</script>
